version: "3"

env:
  IMAGE: ghcr.io/mizuchilabs/tether

tasks:
  dev:
    output: prefixed
    desc: Run backend and frontend concurrently
    deps: [backend, frontend]

  backend:
    desc: Run backend
    env:
      TETHER_PASSWORD: dev-password
      TETHER_API_TOKEN: super-secret-password-32-characters-long
    cmds:
      - go run .

  frontend:
    desc: Run frontend
    dir: web
    cmds:
      - pnpm run dev

  update:
    desc: Update dependencies
    cmds:
      - go get -u ./...
      - go mod tidy
      - cd web && pnpm update --latest

  build:
    desc: Build binary
    cmds:
      - go generate ./...
      - go build -ldflags="-s -w" -trimpath -o tether

  lint:
    desc: Run go vet & lint
    cmds:
      - go mod tidy
      - go fmt ./...
      - go vet ./...
      - govulncheck ./...
      - go test -race -count=1 -cover ./...
      - golangci-lint run --fix

  snapshot:
    desc: Build snapshot
    cmds:
      - goreleaser --snapshot --clean --skip=validate,sign,sbom,archive
      - docker tag goreleaser.ko.local:latest $IMAGE:nightly
      - grype $IMAGE:nightly
