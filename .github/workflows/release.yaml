name: Release

on:
  schedule:
    - cron: "40 3 * * 5"
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      bump: ${{ steps.version.outputs.bump }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: taiki-e/install-action@git-cliff

      - name: Check version bump
        id: version
        run: |
          CURRENT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          NEXT_TAG=$(git-cliff --bumped-version)

          echo "current: $CURRENT_TAG"
          echo "next:    $NEXT_TAG"
          if [ "$CURRENT_TAG" = "$NEXT_TAG" ]; then
            echo "No conventional commits warranting a release. Skipping."
            echo "bump=false" >> "$GITHUB_OUTPUT"
          else
            echo "Bumping $CURRENT_TAG to $NEXT_TAG"
            echo "bump=true" >> "$GITHUB_OUTPUT"
            echo "version=${NEXT_TAG#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag and push
        if: steps.version.outputs.bump == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" \
            -m "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: No-op summary
        if: steps.version.outputs.bump != 'true'
        run: echo "No conventional commits warranting a release." >> "$GITHUB_STEP_SUMMARY"

  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Install UPX
        run: |
          sudo apt-get update
          sudo apt-get install -y upx

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Install Syft
        uses: anchore/sbom-action@v0
        with:
          upload-release-assets: false

      - name: Install Ko
        uses: ko-build/setup-ko@v0.10

      - name: Build frontend
        working-directory: web
        run: pnpm install && pnpm build

      - name: Run GolangCI-Lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=10m

      - uses: golang/govulncheck-action@v1
        with:
          repo-checkout: false

      - uses: taiki-e/install-action@git-cliff

      - name: Generate release notes
        run: git-cliff --latest --strip header --config cliff.toml -o "$RUNNER_TEMP/release-notes.md"

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_YES: "true"
