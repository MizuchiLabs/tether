name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    uses: MizuchiLabs/.github/.github/workflows/go-ci.yaml@main

  # Runs on main only and skips itself for repos without kos in .goreleaser.yaml.
  nightly:
    needs: ci
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: MizuchiLabs/.github/.github/workflows/go-nightly.yaml@main
